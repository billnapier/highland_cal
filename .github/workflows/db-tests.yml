name: Database Tests

# Applies every migration to a real local Supabase stack and runs the pgTAP
# suite in supabase/tests/. This suite is the authorization test suite: RLS is
# the only authorization of record (see AGENTS.md).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/db-tests.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/db-tests.yml'

permissions:
  contents: read

jobs:
  pgtap:
    name: pgtap (auto_expose_new_tables=${{ matrix.auto_expose_new_tables }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Existing club projects expose new tables to the API by default;
        # newer Supabase projects don't. Migrations must work under both, so
        # they grant privileges explicitly instead of relying on defaults.
        auto_expose_new_tables: ['true', 'false']
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # The repo intentionally ships no supabase/config.toml (clubs deploy via
      # the Supabase GitHub integration). Generate a throwaway one for CI only.
      - name: Init local Supabase config
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init --yes
          fi
          sed -i -E 's/^#? *auto_expose_new_tables *=.*/auto_expose_new_tables = ${{ matrix.auto_expose_new_tables }}/' supabase/config.toml
          grep -n 'auto_expose_new_tables' supabase/config.toml

      - name: Start local Postgres and apply migrations
        run: supabase db start

      - name: Run pgTAP tests
        run: supabase test db
