name: API Spec

# Lint the Agent API OpenAPI spec and check spec-to-route drift.
#
# NOTE: this workflow intentionally has NO path filters. Branch protection on
# main requires a passing `lint` check on every pull request, and this
# workflow's `lint` job is what reports that check. Path-gating it (as it was
# before) meant UI-only or docs-only PRs could never satisfy the required
# check and could not be merged.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli@2.71.0 lint docs/openapi.yaml --format=github-actions
      - name: Check spec-to-route drift
        run: npx vitest run lib/api/api-v1.test.ts --reporter=verbose